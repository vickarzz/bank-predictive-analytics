[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-predictive-analytics"
version = "1.0.0"
description = "Churn, credit risk and remittance forecasting pipeline feeding a Power BI (PBIP) report"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ahmad Zulfikar Rafsanjani" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyarrow>=14",
    "joblib>=1.3",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.12"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
bpa = "bpa.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
